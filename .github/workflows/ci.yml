name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependency install step: this plugin has zero runtime dependencies,
      # so the checks below run on a bare Node.
      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test
